<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Financial Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1e1e1e',
                        bordercol: '#2d2d2d',
                        accentgreen: '#22c55e',
                        accentred: '#ef4444',
                        accentblue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #e5e7eb;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#121212] text-gray-200">
    <!-- Top Navigation / Header -->
    <header class="bg-[#1e1e1e] border-b border-[#2d2d2d] sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">SIMCORP FINANCIAL DASHBOARD</h1>
                    <p class="text-xs text-gray-400">As of 8:17 AM 11/12/26 | Company Value: <span class="text-green-400 font-semibold">$45,878</span></p>
                </div>
            </div>
<!-- Navigation Tabs -->
            <nav class="flex flex-wrap gap-1 bg-[#121212] p-1 rounded-xl border border-[#2d2d2d]" id="nav-tabs">
                <button onclick="switchTab('overview')" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow" data-tab="overview">
                    <i class="fa-solid fa-house mr-1"></i> Overview
                </button>
                <button onclick="switchTab('balancesheet')" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 text-gray-400 hover:text-white hover:bg-[#2d2d2d]" data-tab="balancesheet">
                    <i class="fa-solid fa-scale-balanced mr-1"></i> Balance Sheet
                </button>
                <button onclick="switchTab('incomestatement')" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 text-gray-400 hover:text-white hover:bg-[#2d2d2d]" data-tab="incomestatement">
                    <i class="fa-solid fa-file-invoice-dollar mr-1"></i> Income Statement
                </button>
                <button onclick="switchTab('cashflow')" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 text-gray-400 hover:text-white hover:bg-[#2d2d2d]" data-tab="cashflow">
                    <i class="fa-solid fa-money-bill-transfer mr-1"></i> Cash Flow
                </button>
                <button onclick="switchTab('ratios')" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 text-gray-400 hover:text-white hover:bg-[#2d2d2d]" data-tab="ratios">
                    <i class="fa-solid fa-percent mr-1"></i> Ratios
                </button>
            </nav>
        </div>
    </header>
